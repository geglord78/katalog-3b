<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Çakırağa 3B</title>
<!-- Hazır kodlar: A-Frame 1.4.2 ve MindAR 1.2.5 (görsel izleme). İkisi de bu klasörde durur, internet gerekmez.
     Uygulama kataloğun 9. sayfasının KENDİSİNİ tanır (targets.mind; bkz. ../hedef.py). Siyah çerçeveli işaretçi (AR.js) sürümü: ../web-arjs/ -->
<script>
/* Kamera çözünürlüğü. MindAR çözünürlük istemez, tarayıcı 640x480 verir (bulanık görünür). Burada isteğe ideal boyut eklenir.
   "yuksek" = 1280x960: görüntü net; MindAR'ın tarama penceresi 512 piksele çıkar (kısa kenarın yarısı 362'yi geçince), sayfanın
   yarısını görür ama 4 kat işlem ister. "dusuk" = 640x480: MindAR'ın alışık olduğu boyut, her telefonda hızlı.
   Açılışta "yuksek" denenir; telefon saniyede 10 kareden az işliyorsa "dusuk"a geçilip sayfa yeniden yüklenir ve seçim hatırlanır.
   Adres eki: ?c=yuksek / ?c=dusuk seçimi zorlar, &oto=0 otomatik geçişi kapatır (deneme düzeneği için). */
var COZ = (function () {
  var m = (location.search.match(/[?&]c=(yuksek|dusuk)/) || [])[1];
  if (!m) { try { m = localStorage.getItem('cakiraga-coz'); } catch (e) {} }
  return m === 'dusuk' ? 'dusuk' : 'yuksek';
})();
(function () {
  var md = navigator.mediaDevices;
  if (!md || !md.getUserMedia) return;
  var eski = md.getUserMedia.bind(md), boyut = COZ === 'yuksek' ? [1280, 960] : [640, 480];
  md.getUserMedia = function (k) {
    if (k && k.video && typeof k.video === 'object' && !k.video.width) {
      k = { audio: false, video: Object.assign({}, k.video, { width: { ideal: boyut[0] }, height: { ideal: boyut[1] } }) };
    }
    return eski(k);
  };
})();
</script>
<script src="aframe-v1.4.2.min.js"></script>
<script src="mindar-image-aframe.prod.js"></script>
<style>
  html { background: #0F1512; }   /* zemin yalnız html'de: body'de olursa arkaya konan kamera görüntüsünü örter */
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  .ust { position: fixed; left: 0; right: 0; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; color: #F6F6F1; background: linear-gradient(#0F1512cc, #0F151200); pointer-events: none; }
  .ust b { font-size: 13px; letter-spacing: .14em; font-weight: 800; }
  .ust span { font-size: 11px; letter-spacing: .08em; color: #C8EA55; pointer-events: auto; padding: 8px 0 8px 12px; }
  #teshis { position: fixed; left: 16px; top: 44px; z-index: 20; font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace; color: #F6F6F1; background: #0F1512aa; padding: 3px 6px; border-radius: 4px; pointer-events: none; }
  .alt { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 18px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: linear-gradient(#0F151200, #0F1512dd); pointer-events: none; }
  .alt p { margin: 0; padding: 10px 16px; border-radius: 999px; background: #0F1512; color: #F6F6F1; font-size: 15px; font-weight: 600; border: 1px solid #7DB928; }
  .alt p.var { background: #7DB928; color: #0F1512; }
  .alt p.hata { border-color: #E5604D; }
  #oda { pointer-events: auto; line-height: 0; }
  #durus { pointer-events: auto; appearance: none; border: 1px solid #F6F6F166; background: #0F1512cc; color: #F6F6F1; font: 600 13px system-ui, sans-serif; padding: 8px 14px; border-radius: 999px; }
</style>
</head>
<body>
<div class="ust"><b>ÇAKIRAĞA GRUP</b><span id="etiket">3B · ÖRNEK MODEL</span></div>
<div id="teshis">…</div>
<div class="alt">
  <a id="oda" rel="ar" href="traktor.usdz" hidden><img alt="Odana yerleştir, gerçek boyut" width="250" height="40" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27250%27%20height%3D%2740%27%3E%3Crect%20width%3D%27250%27%20height%3D%2740%27%20rx%3D%2720%27%20fill%3D%27%237DB928%27/%3E%3Ctext%20x%3D%27125%27%20y%3D%2725%27%20text-anchor%3D%27middle%27%20font-family%3D%27-apple-system%2CHelvetica%2CArial%2Csans-serif%27%20font-size%3D%2714%27%20font-weight%3D%27700%27%20fill%3D%27%230F1512%27%3EOdana%20yerle%C5%9Ftir%20%C2%B7%20ger%C3%A7ek%20boyut%3C/text%3E%3C/svg%3E"></a>
  <button id="durus" type="button">Duruş: masadaki sayfa</button>
  <p id="ipucu">Model yükleniyor…</p>
</div>

<script>
/* Modeli sığdırır: en uzun kenarı "boy" birim olur (1 birim = sayfanın genişliği, 21 cm), tabanı yere basar, ortalanır. */
AFRAME.registerComponent('sigdir', {
  schema: { boy: { default: 0.8 } },
  init: function () {
    var el = this.el, boy = this.data.boy;
    el.addEventListener('model-loaded', function () {
      var o = el.getObject3D('mesh');
      var klon = o.clone();                       // ebeveynsiz kopya: kutu, sahnedeki konumdan bağımsız ölçülür
      klon.position.set(0, 0, 0); klon.rotation.set(0, 0, 0); klon.scale.set(1, 1, 1);
      klon.updateMatrixWorld(true);
      var kutu = new THREE.Box3().setFromObject(klon);
      var b = new THREE.Vector3(), m = new THREE.Vector3();
      kutu.getSize(b); kutu.getCenter(m);
      var k = boy / Math.max(b.x, b.y, b.z);
      o.scale.setScalar(k);
      o.position.set(-m.x * k, -kutu.min.y * k, -m.z * k);
      window.MODEL_HAZIR = true;
      durum();
    });
    el.addEventListener('model-error', function () { window.MODEL_HATA = true; durum(); });
  }
});

/* Modelin altına yumuşak kenarlı gölge. */
AFRAME.registerComponent('golge', {
  schema: { cap: { default: 1.2 } },
  init: function () {
    var c = document.createElement('canvas'); c.width = c.height = 256;
    var x = c.getContext('2d'), g = x.createRadialGradient(128, 128, 8, 128, 128, 128);
    g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(0.55, 'rgba(0,0,0,.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    var m = new THREE.Mesh(new THREE.PlaneGeometry(this.data.cap, this.data.cap),
                           new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.003;
    this.el.setObject3D('golge', m);
  }
});

function durum() {
  var p = document.getElementById('ipucu');
  if (!p) return;
  p.className = '';
  if (window.KAMERA_HATA) { p.className = 'hata'; p.textContent = 'Kamera açılamadı. Kamera iznini verip yeniden aç.'; }
  else if (window.MODEL_HATA) { p.className = 'hata'; p.textContent = 'Model yüklenemedi.'; }
  else if (!window.MODEL_HAZIR) p.textContent = 'Model yükleniyor…';
  else if (!window.AR_HAZIR) p.textContent = 'Kamera hazırlanıyor…';
  else if (window.GORUNUYOR) { p.className = 'var'; p.textContent = 'Sürükle: döndür · İki parmak: büyüt'; }
  else p.textContent = 'Kamerayı kataloğun 9. sayfasına tut';
}
</script>

<!-- filterMinCF / filterBeta: konum yumuşatma (küçük = daha sakin, büyük = daha çevik). missTolerance: hedef bir an kaybolsa da model kaç kare kalsın. -->
<a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; filterMinCF: 0.0005; filterBeta: 200; missTolerance: 12; warmupTolerance: 3; uiLoading: no; uiScanning: no; uiError: no"
         vr-mode-ui="enabled: false" loading-screen="enabled: false" device-orientation-permission-ui="enabled: false"
         renderer="antialias: true; alpha: true; colorManagement: true">
  <a-entity light="type: ambient; intensity: 0.9"></a-entity>
  <a-entity light="type: directional; intensity: 0.9" position="1 2 3"></a-entity>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <!-- Hedefin kendi eksenleri: x sağ, y sayfanın üstü, z sayfadan dışarı; 1 birim = sayfanın genişliği. Başlangıç sayfanın ortası. -->
  <a-entity id="hedef" mindar-image-target="targetIndex: 0">
    <!-- yer: basılı traktör fotoğrafının tekerlek hizası (sayfanın ortasından 0,30 birim aşağı) -->
    <a-entity id="yer" position="0 -0.30 0" rotation="90 0 0">
      <a-entity id="govde" rotation="0 -35 0">
        <a-entity golge="cap: 1.2"></a-entity>
        <a-entity id="model" gltf-model="url(traktor.glb)" sigdir="boy: 0.65"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>

<script>
var sahne = document.querySelector('a-scene'), hedef = document.getElementById('hedef');
sahne.addEventListener('arReady', function () {
  window.AR_HAZIR = true; durum();
  if (COZ !== 'yuksek' || /[?&]oto=0/.test(location.search)) return;
  setTimeout(function () {                      // 1. saniyeden 4. saniyeye: işleme hızını ölç
    var bas = TESHIS.guncelleme;
    setTimeout(function () {
      if ((TESHIS.guncelleme - bas) / 3 < 10) { try { localStorage.setItem('cakiraga-coz', 'dusuk'); } catch (e) {} location.replace('index.html?c=dusuk'); }
    }, 3000);
  }, 1000);
});
sahne.addEventListener('arError', function () { window.KAMERA_HATA = true; durum(); });
hedef.addEventListener('targetFound', function () { window.GORUNUYOR = true; TESHIS.bulma++; durum(); });
hedef.addEventListener('targetLost', function () { window.GORUNUYOR = false; durum(); });
hedef.addEventListener('targetUpdate', function () { TESHIS.guncelleme++; });
var TESHIS = { bulma: 0, guncelleme: 0 };

/* Deneme düzeneği (dene3.py) için: hedefin o anki durumu. */
window.DURUM = function () { var o = hedef.object3D; return { gor: o.visible, m: Array.from(o.matrix.elements) }; };

/* Duruş: basılı katalog masada yatarken traktör sayfanın ÜSTÜNDE durur. Sayfa dik bir ekranda ya da duvardaysa aynı duruş
   traktörü tepeden gösterir; "ekran/duvar" duruşunda traktör sayfadan öne doğru çıkar ve yandan görünür. */
(function () {
  var dugme = document.getElementById('durus'), yer = document.getElementById('yer'), masa = true;
  dugme.addEventListener('click', function () {
    masa = !masa;
    yer.setAttribute('rotation', masa ? '90 0 0' : '0 0 0');
    yer.setAttribute('position', masa ? '0 -0.30 0' : '0 -0.30 0.25');
    dugme.textContent = masa ? 'Duruş: masadaki sayfa' : 'Duruş: ekran / duvar';
  });
})();

/* Dokunma: tek parmak sürükle = döndür, iki parmak = büyüt/küçült. */
(function () {
  var aci = -35, olcek = 1, sonX = null, sonAra = null;
  function uygula() {
    var g = document.getElementById('govde');
    g.object3D.rotation.y = aci * Math.PI / 180;
    g.object3D.scale.setScalar(olcek);
  }
  function ara(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
  document.addEventListener('touchstart', function (e) {
    if (e.target.id === 'durus' || e.target.id === 'etiket') return;
    if (e.touches.length === 1) { sonX = e.touches[0].clientX; sonAra = null; }
    if (e.touches.length === 2) { sonAra = ara(e.touches); sonX = null; }
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length === 1 && sonX !== null) { aci += (e.touches[0].clientX - sonX) * 0.6; sonX = e.touches[0].clientX; uygula(); }
    if (e.touches.length === 2 && sonAra) { var a = ara(e.touches); olcek = Math.min(4, Math.max(0.3, olcek * a / sonAra)); sonAra = a; uygula(); }
  }, { passive: true });
  document.addEventListener('touchend', function () { sonX = null; sonAra = null; }, { passive: true });
})();

/* Teşhis satırı ("3B · ÖRNEK MODEL" yazısına dokununca gizlenir/görünür): kamera görüntüsünün boyutu, hedef görülüyor mu,
   saniyedeki konum güncellemesi, hedefin kaç kez bulunduğu. */
(function () {
  var el = document.getElementById('teshis'), son = 0;
  document.getElementById('etiket').addEventListener('click', function () { el.hidden = !el.hidden; });
  setInterval(function () {
    var v = document.querySelector('video'), hiz = (TESHIS.guncelleme - son) * 2; son = TESHIS.guncelleme;
    el.textContent = (v && v.videoWidth ? v.videoWidth + '×' + v.videoHeight : 'kamera yok') + ' (' + COZ + ') · hedef ' + (window.GORUNUYOR ? 'var' : 'yok') +
      ' · ' + hiz + '/sn · bulma ' + TESHIS.bulma + (window.AR_HAZIR ? '' : ' · AR hazır değil');
  }, 500);
})();
/* iPhone: Apple'ın AR görüntüleyicisi varsa "Odana yerleştir" düğmesini göster. */
(function () { var a = document.getElementById('oda'); if (a && a.relList && a.relList.supports && a.relList.supports('ar')) a.hidden = false; })();
durum();
</script>
</body>
</html>
